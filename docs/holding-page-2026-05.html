  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://gaffur.net/#org",
    "name": "gaffur",
    "url": "https://gaffur.net",

    "inLanguage": "tr-TR"
  }

  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --muted: #737373;
      --accent: #d97706;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .stack {
      text-align: center;
      max-width: 32rem;
    }
    .logo {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 200;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--fg);
    }
    .cursor {
      display: inline-block;
      width: 0.4ch;
      height: 0.85em;
      background: var(--accent);
      margin-left: 0.08em;
      vertical-align: -0.06em;
      animation: blink 1.2s steps(2) infinite;
    }
    .tagline {
      margin-top: 1.5rem;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    @keyframes blink { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
    footer {
      padding: 1.5rem 2rem;
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    footer a:hover, footer a:focus-visible { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <div class="stack">
      <h1 class="logo">gaffur<span class="cursor" aria-hidden="true"></span></h1>
      <p class="tagline">Yeniden.</p>
    </div>
  </main>
  <footer>
    <span>© 2026 gaffur.net</span>
    <span><a href="mailto:emociksin@gmail.com">İletişim</a></span>
  </footer>
</body>
